name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create dummy .env
        run: cp .env.example .env

      - name: Settings smoke check
        run: |
          python -c "
          from config.settings import settings
          assert settings.marketplace_id == 'A1RKKUPIHCS9HS'
          assert settings.flask_env == 'production'
          assert settings.simulate_mode is True
          rules = settings.load_rules()
          assert rules['pricing']['vat_rate'] == 0.21
          assert rules['pricing']['shipping_cost'] == 4.0
          print('Settings OK')
          "

      - name: Run test suite
        run: pytest tests/ -v

      - name: Lint with flake8 (optional)
        continue-on-error: true
        run: |
          pip install flake8
          flake8 src/ config/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ config/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
