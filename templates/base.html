<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Wyzinc Amazon Sync{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f6f8fa; }
    .badge-status { font-size: 0.78em; }
    .badge-listed       { background:#198754; }
    .badge-ean_match    { background:#0d6efd; }
    .badge-needs_review { background:#fd7e14; }
    .badge-no_match     { background:#6c757d; }
    .badge-approved     { background:#6610f2; }
    .badge-created      { background:#20c997; }
    .badge-failed       { background:#dc3545; }
    .badge-skipped      { background:#adb5bd; }
    .badge-unscanned    { background:#ced4da; color:#000; }
    .badge-error        { background:#dc3545; }
    .sku-cell { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:0.9em; }
    .table-sm td, .table-sm th { vertical-align: middle; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">Wyzinc &middot; Amazon Sync</a>
    <span class="navbar-text small">Marketplace: <code class="text-light">{{ config.MARKETPLACE_ID or 'ES' }}</code></span>
  </div>
</nav>
<div class="container-fluid">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
